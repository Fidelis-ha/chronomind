# Autonomous Programming Agent Config
# Für ChronoMind Projekt

project_slug: chronomind
project_dir: /opt/data/chronomind
base_branch: main
branch_prefix: fidelis

# Vercel
vercel_token_file: /opt/data/.vercel_token

# Quality Gate Commands
lint_command: npm run lint
typecheck_command: npx tsc --noEmit
build_command: npm run build
telegram_chat_id: "58614728"

# Allowed Toolsets für LLM-Subagenten
allowed_toolsets:
  - terminal
  - file
  - browser

# Smoke Test URLs (erste Zeile: Pfad, Zweite: Erwarteter Status)
smoke_test_urls:
  - "/sign-in:200"
  - "/:200"
  - "/entries:200"
